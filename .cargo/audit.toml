# cargo-audit 豁免配置（CI 使用 `cargo audit --deny warnings --file Cargo.lock`）。
#
# 当前锁文件包含 9 条「unmaintained」和 1 条「unsound」警告级告警。
# 前者来自 Linux 托盘的 GTK3 依赖链及构建期宏传递依赖；后者是
# glib 0.18 中 VariantStrIter 的迭代方法可能触发未定义行为。项目源码
# 与当前 Linux 托盘路径未直接调用受影响方法，但 GTK3 依赖链尚无法
# 升级到已修复的 glib 0.20，因此仍作为残余风险记录。Windows/macOS
# 产物不引入这条 Linux GTK3 链。详见 AUDIT_REPORT 第 5 节。
#
# 当前无已知 vulnerability 告警；任何未列入下方清单的新安全告警
# 仍会被 CI 拦截。

[advisories]
ignore = [
    # gtk-rs GTK3 绑定整体停止维护（7 条，Linux 托盘链）
    "RUSTSEC-2024-0412", # gdk
    "RUSTSEC-2024-0413", # atk
    "RUSTSEC-2024-0415", # gtk
    "RUSTSEC-2024-0416", # atk-sys
    "RUSTSEC-2024-0418", # gdk-sys
    "RUSTSEC-2024-0419", # gtk3-macros
    "RUSTSEC-2024-0420", # gtk-sys
    # gtk-rs 传递依赖，随 GTK3 链停止维护
    "RUSTSEC-2024-0436", # paste
    # toml_edit 早期版本的传递依赖（构建期宏），上游无替代版本可用
    "RUSTSEC-2024-0370", # proc-macro-error
    # glib 0.18 VariantStrIter 迭代方法的未定义行为（Linux GTK3 链）
    "RUSTSEC-2024-0429", # glib; fixed in 0.20, current code has no direct call
]
