<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ashell - 会话状态样式预览</title>
  <style>
    :root {
      --bg: #0b0b0b;
      --panel: #171717;
      --panel-2: #202020;
      --line: #303030;
      --text: #f5f5f5;
      --muted: #969696;
      --hover: #292929;
      --active: #f5f5f5;
      --active-text: #0b0b0b;
      --accent: #f5f5f5;
      --connected: #a7d797;
      --canvas: #101010;
      --window-shadow: #00000045;
      --soft-border: #ffffff12;
      --accent-soft: #ffffff1a;
      --accent-mid: #ffffff70;
    }

    [data-theme="light"] {
      --bg: #ffffff;
      --panel: #f5f5f5;
      --panel-2: #ededed;
      --line: #d7d7d7;
      --text: #151515;
      --muted: #6b6b6b;
      --hover: #e6e6e6;
      --active: #151515;
      --active-text: #ffffff;
      --accent: #151515;
      --connected: #267a43;
      --canvas: #e9e9e9;
      --window-shadow: #00000020;
      --soft-border: #15151510;
      --accent-soft: #15151512;
      --accent-mid: #15151568;
    }

    [data-theme="vscode"] {
      --bg: #1e1e1e;
      --panel: #252526;
      --panel-2: #2d2d30;
      --line: #3e3e42;
      --text: #ffffff;
      --muted: #a5a5a5;
      --hover: #37373d;
      --active: #094771;
      --active-text: #ffffff;
      --accent: #007acc;
      --connected: #89d185;
      --canvas: #181818;
      --window-shadow: #00000045;
      --soft-border: #ffffff10;
      --accent-soft: #007acc1f;
      --accent-mid: #007acc9a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background: var(--canvas);
      color: var(--text);
      font-family: "Noto Sans CJK SC", "Microsoft YaHei UI", "Segoe UI", sans-serif;
      letter-spacing: 0;
      transition: background-color .16s ease, color .16s ease;
    }

    button { font: inherit; color: inherit; }

    .preview {
      width: min(1360px, calc(100vw - 32px));
      min-height: calc(100vh - 32px);
      margin: 16px auto;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg);
      box-shadow: 0 18px 48px var(--window-shadow);
    }

    .titlebar {
      height: 40px;
      display: grid;
      grid-template-columns: 180px minmax(0, 1fr) 138px;
      align-items: stretch;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    .brand, .title, .window-controls { display: flex; align-items: center; }
    .brand { gap: 9px; padding: 0 14px; font-size: 13px; font-weight: 650; }
    .brand svg { width: 17px; height: 17px; color: var(--accent); }
    .title { min-width: 0; justify-content: center; color: var(--muted); font-size: 11px; }
    .window-controls { justify-content: flex-end; }
    .window-control { width: 46px; height: 39px; display: grid; place-items: center; border: 0; background: transparent; cursor: default; }
    .window-control svg { width: 13px; height: 13px; }
    .window-control:hover { background: var(--hover); }
    .window-control.close:hover { color: #fff; background: #c42b1c; }

    .toolbar {
      min-height: 54px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      background: var(--bg);
    }

    .toolbar h1 { margin: 0; font-size: 14px; font-weight: 650; }
    .toolbar p { margin: 3px 0 0; color: var(--muted); font-size: 10px; }

    .theme-switch {
      flex: none;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 2px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
    }

    .theme-switch button {
      height: 28px;
      padding: 0 11px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--muted);
      font-size: 10px;
      cursor: pointer;
    }

    .theme-switch button:hover { color: var(--text); background: var(--hover); }
    .theme-switch button.active { color: var(--active-text); background: var(--active); }

    .comparison {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1px;
      background: var(--line);
    }

    .option {
      min-width: 0;
      min-height: 322px;
      padding: 16px;
      background: var(--bg);
    }

    .option-heading {
      min-height: 36px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 12px;
    }

    .option-heading h2 { margin: 0; font-size: 12px; font-weight: 650; }
    .option-heading p { margin: 4px 0 0; color: var(--muted); font-size: 10px; }
    .recommended { flex: none; padding: 3px 6px; border: 1px solid var(--accent-mid); border-radius: 4px; color: var(--text); font-size: 9px; }

    .sidebar-frame {
      width: min(100%, 386px);
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
    }

    .folder {
      height: 28px;
      padding: 0 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
    }

    .folder svg { width: 13px; height: 13px; }
    .folder .count { margin-left: auto; font-weight: 400; }
    .session-list { display: grid; gap: 4px; }

    .session {
      position: relative;
      width: 100%;
      height: 46px;
      padding: 5px 9px;
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) 12px;
      align-items: center;
      gap: 8px;
      overflow: hidden;
      border: 1px solid transparent;
      border-radius: 5px;
      background: transparent;
      text-align: left;
      cursor: pointer;
      outline: 0;
      transition: background-color .15s ease, border-color .15s ease, box-shadow .15s ease, color .15s ease;
    }

    .session-icon {
      width: 23px;
      height: 23px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--panel-2);
      transition: background-color .15s ease, border-color .15s ease, color .15s ease;
    }

    .session-icon svg { width: 13px; height: 13px; }
    .session-copy { min-width: 0; }
    .session-name { display: block; overflow: hidden; color: var(--text); font-size: 10px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .session-host { display: block; margin-top: 2px; overflow: hidden; color: var(--muted); font: 9px "Noto Sans Mono CJK SC", "Cascadia Mono", monospace; text-overflow: ellipsis; white-space: nowrap; }
    .online { width: 7px; height: 7px; border-radius: 50%; background: var(--connected); box-shadow: 0 0 0 2px color-mix(in srgb, var(--connected), transparent 80%); }
    .offline { width: 7px; height: 7px; border: 1px solid var(--muted); border-radius: 50%; opacity: .55; }

    /* 方案 1：低对比常驻边界，交互时平滑显现。 */
    .soft-outline .session { border-color: var(--soft-border); }
    .soft-outline .session:hover { border-color: color-mix(in srgb, var(--text), transparent 68%); background: var(--hover); }
    .soft-outline .session.connected { border-color: color-mix(in srgb, var(--connected), transparent 66%); }
    .soft-outline .session.active { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent), transparent 78%); }

    /* 方案 2：用 inset shadow 保持边缘柔和，并避免双边线。 */
    .inner-ring .session:hover { background: var(--hover); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--text), transparent 78%); }
    .inner-ring .session.connected { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--connected), transparent 66%); }
    .inner-ring .session.active { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent), inset 3px 0 0 var(--accent); }

    /* 方案 3：完整描边让位给左侧状态线。 */
    .status-rail .session::before {
      content: "";
      position: absolute;
      left: 0;
      top: 9px;
      bottom: 9px;
      width: 2px;
      border-radius: 0 2px 2px 0;
      background: transparent;
      transition: background-color .15s ease, top .15s ease, bottom .15s ease, width .15s ease;
    }
    .status-rail .session:hover { background: var(--hover); }
    .status-rail .session.connected::before { background: color-mix(in srgb, var(--connected), transparent 30%); }
    .status-rail .session.active { background: var(--accent-soft); }
    .status-rail .session.active::before { top: 6px; bottom: 6px; width: 3px; background: var(--accent); }

    /* 方案 4：鼠标状态只改变背景，轮廓专供当前项和键盘焦点。 */
    .focus-outline .session:hover { background: var(--hover); }
    .focus-outline .session.connected { background: color-mix(in srgb, var(--connected), transparent 94%); }
    .focus-outline .session.active { background: var(--active); color: var(--active-text); outline: 1px solid var(--accent); outline-offset: -1px; }
    .focus-outline .session.active .session-name { color: var(--active-text); }
    .focus-outline .session.active .session-host { color: color-mix(in srgb, var(--active-text), transparent 35%); }
    .focus-outline .session.active .session-icon { color: var(--active); border-color: transparent; background: var(--active-text); }
    .session:focus-visible { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--accent); }

    .legend {
      min-height: 34px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      border-top: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      font-size: 9px;
    }

    .legend span { display: flex; align-items: center; gap: 5px; }
    .legend i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
    .legend .connected-dot { background: var(--connected); }
    .legend .active-dot { border: 1px solid var(--accent); background: var(--accent-soft); }

    @media (max-width: 780px) {
      .preview { width: 100%; min-height: 100vh; margin: 0; border: 0; border-radius: 0; }
      .titlebar { grid-template-columns: 110px minmax(0, 1fr) 92px; }
      .window-control { width: 30px; }
      .toolbar { align-items: flex-start; flex-direction: column; }
      .theme-switch { width: 100%; }
      .comparison { grid-template-columns: 1fr; }
      .sidebar-frame { width: 100%; }
      .legend { flex-wrap: wrap; gap: 8px 14px; }
    }
  </style>
</head>
<body data-theme="dark">
  <main class="preview">
    <header class="titlebar">
      <div class="brand"><i data-lucide="square-terminal"></i><span>ashell</span></div>
      <div class="title">会话状态样式预览</div>
      <div class="window-controls" aria-hidden="true">
        <button class="window-control"><i data-lucide="minus"></i></button>
        <button class="window-control"><i data-lucide="square"></i></button>
        <button class="window-control close"><i data-lucide="x"></i></button>
      </div>
    </header>

    <section class="toolbar">
      <div>
        <h1>已保存会话 · 状态层级</h1>
        <p>悬浮查看过渡，点击任意会话切换当前状态</p>
      </div>
      <div class="theme-switch" aria-label="主题">
        <button data-theme-choice="dark" class="active">深色</button>
        <button data-theme-choice="light">浅色</button>
        <button data-theme-choice="vscode">VS Code</button>
      </div>
    </section>

    <section class="comparison">
      <article class="option soft-outline">
        <header class="option-heading">
          <div><h2>01 · 柔和渐显描边</h2><p>默认边界很淡，连接与当前状态逐级增强</p></div>
          <span class="recommended">推荐</span>
        </header>
        <div class="sidebar-frame">
          <div class="folder"><i data-lucide="folder-open"></i><span>生产环境</span><span class="count">3 个客户端</span><i data-lucide="chevron-down"></i></div>
          <div class="session-list">
            <button class="session active connected"><span class="session-icon"><i data-lucide="server"></i></span><span class="session-copy"><span class="session-name">Shanghai Production</span><span class="session-host">prod@shanghai:22</span></span><span class="online"></span></button>
            <button class="session connected"><span class="session-icon"><i data-lucide="server"></i></span><span class="session-copy"><span class="session-name">Beijing Analytics</span><span class="session-host">ops@beijing:22</span></span><span class="online"></span></button>
            <button class="session"><span class="session-icon"><i data-lucide="server"></i></span><span class="session-copy"><span class="session-name">Shenzhen Backup</span><span class="session-host">backup@shenzhen:22</span></span><span class="offline"></span></button>
          </div>
        </div>
      </article>

      <article class="option inner-ring">
        <header class="option-heading">
          <div><h2>02 · 内描边</h2><p>边缘落在组件内部，当前状态带短内侧强调</p></div>
        </header>
        <div class="sidebar-frame">
          <div class="folder"><i data-lucide="folder-open"></i><span>生产环境</span><span class="count">3 个客户端</span><i data-lucide="chevron-down"></i></div>
          <div class="session-list">
            <button class="session active connected"><span class="session-icon"><i data-lucide="server"></i></span><span class="session-copy"><span class="session-name">Shanghai Production</span><span class="session-host">prod@shanghai:22</span></span><span class="online"></span></button>
            <button class="session connected"><span class="session-icon"><i data-lucide="server"></i></span><span class="session-copy"><span class="session-name">Beijing Analytics</span><span class="session-host">ops@beijing:22</span></span><span class="online"></span></button>
            <button class="session"><span class="session-icon"><i data-lucide="server"></i></span><span class="session-copy"><span class="session-name">Shenzhen Backup</span><span class="session-host">backup@shenzhen:22</span></span><span class="offline"></span></button>
          </div>
        </div>
      </article>

      <article class="option status-rail">
        <header class="option-heading">
          <div><h2>03 · 左侧状态线</h2><p>取消完整描边，用状态线和背景建立层级</p></div>
        </header>
        <div class="sidebar-frame">
          <div class="folder"><i data-lucide="folder-open"></i><span>生产环境</span><span class="count">3 个客户端</span><i data-lucide="chevron-down"></i></div>
          <div class="session-list">
            <button class="session active connected"><span class="session-icon"><i data-lucide="server"></i></span><span class="session-copy"><span class="session-name">Shanghai Production</span><span class="session-host">prod@shanghai:22</span></span><span class="online"></span></button>
            <button class="session connected"><span class="session-icon"><i data-lucide="server"></i></span><span class="session-copy"><span class="session-name">Beijing Analytics</span><span class="session-host">ops@beijing:22</span></span><span class="online"></span></button>
            <button class="session"><span class="session-icon"><i data-lucide="server"></i></span><span class="session-copy"><span class="session-name">Shenzhen Backup</span><span class="session-host">backup@shenzhen:22</span></span><span class="offline"></span></button>
          </div>
        </div>
      </article>

      <article class="option focus-outline">
        <header class="option-heading">
          <div><h2>04 · 背景层级</h2><p>默认无边界，只有当前会话显示完整焦点轮廓</p></div>
        </header>
        <div class="sidebar-frame">
          <div class="folder"><i data-lucide="folder-open"></i><span>生产环境</span><span class="count">3 个客户端</span><i data-lucide="chevron-down"></i></div>
          <div class="session-list">
            <button class="session active connected"><span class="session-icon"><i data-lucide="server"></i></span><span class="session-copy"><span class="session-name">Shanghai Production</span><span class="session-host">prod@shanghai:22</span></span><span class="online"></span></button>
            <button class="session connected"><span class="session-icon"><i data-lucide="server"></i></span><span class="session-copy"><span class="session-name">Beijing Analytics</span><span class="session-host">ops@beijing:22</span></span><span class="online"></span></button>
            <button class="session"><span class="session-icon"><i data-lucide="server"></i></span><span class="session-copy"><span class="session-name">Shenzhen Backup</span><span class="session-host">backup@shenzhen:22</span></span><span class="offline"></span></button>
          </div>
        </div>
      </article>
    </section>

    <footer class="legend"><span><i></i>未连接</span><span><i class="connected-dot"></i>已连接</span><span><i class="active-dot"></i>当前会话</span><span>键盘焦点保留独立高亮</span></footer>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    lucide.createIcons();

    document.querySelectorAll('[data-theme-choice]').forEach((button) => {
      button.addEventListener('click', () => {
        document.body.dataset.theme = button.dataset.themeChoice;
        document.querySelectorAll('[data-theme-choice]').forEach((choice) => choice.classList.toggle('active', choice === button));
      });
    });

    document.querySelectorAll('.option').forEach((option) => {
      option.querySelectorAll('.session').forEach((session) => {
        session.addEventListener('click', () => {
          option.querySelectorAll('.session').forEach((item) => item.classList.remove('active'));
          session.classList.add('active');
        });
      });
    });
  </script>
</body>
</html>
