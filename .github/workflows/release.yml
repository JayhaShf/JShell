name: Release

# Build native binaries for Windows / Linux / macOS.
#  - Push a tag like `v0.2.3`  -> builds all platforms and attaches the archives
#    to a GitHub Release.
#  - Run manually (workflow_dispatch) -> builds all platforms and uploads them as
#    downloadable workflow artifacts (no release created).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Checkout pinned RustSec advisory database
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: RustSec/advisory-db
          ref: 2f08fbb85332687b721f2f22706d07448369451b
          path: .rustsec-advisory-db
          persist-credentials: false

      - name: Verify RustSec advisory database freshness
        shell: bash
        run: |
          set -euo pipefail
          DB_TIMESTAMP="$(git -C .rustsec-advisory-db show -s --format=%ct HEAD)"
          NOW="$(date -u +%s)"
          MAX_AGE_SECONDS="$((14 * 24 * 60 * 60))"
          AGE_SECONDS="$((NOW - DB_TIMESTAMP))"

          if (( AGE_SECONDS < 0 || AGE_SECONDS > MAX_AGE_SECONDS )); then
            echo "::error::Pinned RustSec advisory database is older than 14 days; update its commit before releasing."
            exit 1
          fi

          git -C .rustsec-advisory-db show -s --format='RustSec database: %H (%cI)' HEAD

      # GPUI needs these system libs on Linux to compile.
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake \
            libfontconfig1-dev libfreetype6-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev \
            libudev-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: quality

      - name: Install cargo-audit
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: cargo-audit@0.22.0

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --locked

      - name: Check all targets
        run: cargo check --locked --all-targets

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Audit locked dependencies
        run: >-
          cargo audit --deny warnings --file Cargo.lock
          --db .rustsec-advisory-db --no-fetch

  build:
    name: ${{ matrix.name }}
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            bin: jshell.exe
            run_tests: true
          - os: ubuntu-22.04 # build on the oldest supported runner for broader glibc compatibility
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            bin: jshell
            run_tests: true
          - os: macos-15 # Apple Silicon
            target: aarch64-apple-darwin
            name: macos-aarch64
            bin: jshell
            run_tests: true
          - os: macos-15 # Intel (cross-compiled from Apple Silicon to avoid queue delays)
            target: x86_64-apple-darwin
            name: macos-x86_64
            bin: jshell
            run_tests: false

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}

      - name: Resolve package version and verify release tag
        shell: bash
        run: |
          set -euo pipefail

          if ! PACKAGE_ID="$(cargo pkgid --locked)"; then
            echo "::error::Failed to read package metadata with 'cargo pkgid --locked'."
            exit 1
          fi

          if [[ "$PACKAGE_ID" =~ \#jshell@([^[:space:]#@]+)$ ]]; then
            CARGO_VERSION="${BASH_REMATCH[1]}"
          else
            echo "::error::Unexpected package ID from 'cargo pkgid --locked': $PACKAGE_ID"
            echo "::error::Expected a package ID ending in '#jshell@<version>'."
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            EXPECTED_TAG="v${CARGO_VERSION}"
            if [[ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]]; then
              echo "::error::Release tag '$GITHUB_REF_NAME' does not match Cargo.toml package.version '$CARGO_VERSION' (expected '$EXPECTED_TAG')."
              exit 1
            fi
          fi

          echo "PACKAGE_VERSION=$CARGO_VERSION" >> "$GITHUB_ENV"

      # GPUI needs these system libs on Linux to compile.
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake \
            libfontconfig1-dev libfreetype6-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev \
            libudev-dev libayatana-appindicator3-1 \
            dbus-x11 gnome-keyring xauth xvfb

      - name: Cache cargo build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}

      - name: Run native target tests
        if: matrix.run_tests
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Compile cross-target tests
        if: ${{ ! matrix.run_tests }}
        run: cargo test --locked --target ${{ matrix.target }} --no-run

      - name: Build (release)
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            VERSION_LABEL="$GITHUB_REF_NAME"
          else
            VERSION_LABEL="v${PACKAGE_VERSION}-dev.${GITHUB_RUN_NUMBER}"
          fi
          STAGE="jshell-${VERSION_LABEL}-${{ matrix.name }}"

          if [ "${{ runner.os }}" = "macOS" ]; then
            # ── Build a proper .app bundle ────────────────────────────────────
            # Note: We build the bundle manually here rather than running
            # scripts/package-macos-app.sh, because that script runs `cargo build`
            # without respecting the `--target` flag from the matrix.

            APP="JShell.app"
            CONTENTS="$APP/Contents"
            mkdir -p "$CONTENTS/MacOS" "$CONTENTS/Resources"

            cp "target/${{ matrix.target }}/release/jshell" "$CONTENTS/MacOS/JShell"
            cp "assets/icons/jshell.icns" "$CONTENTS/Resources/jshell.icns"
            bash scripts/stage-release-licenses.sh "$CONTENTS/Resources/licenses"

            cat > "$CONTENTS/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>JShell</string>
            <key>CFBundleIconFile</key>
            <string>jshell.icns</string>
            <key>CFBundleIdentifier</key>
            <string>io.github.jayhashf.jshell</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>JShell</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${PACKAGE_VERSION}</string>
            <key>CFBundleVersion</key>
            <string>${GITHUB_RUN_NUMBER}</string>
            <key>LSMinimumSystemVersion</key>
            <string>12.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

            printf 'APPL????' > "$CONTENTS/PkgInfo"

            # Ad-hoc code-sign the assembled bundle.
            codesign --force --deep --sign - "$APP"
            codesign --verify --verbose "$APP"

            # Package with ditto (Apple's tool) to preserve signature/metadata
            ditto -c -k --keepParent "$APP" "${STAGE}.zip"
            echo "ASSET=${STAGE}.zip" >> "$GITHUB_ENV"

          elif [ "${{ runner.os }}" = "Windows" ]; then
            mkdir "$STAGE"
            cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$STAGE/"
            bash scripts/stage-release-licenses.sh "$STAGE"
            7z a "${STAGE}.zip" "$STAGE" >/dev/null
            echo "ASSET=${STAGE}.zip" >> "$GITHUB_ENV"

          else
            # Linux
            mkdir "$STAGE"
            cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$STAGE/"
            bash scripts/stage-release-licenses.sh "$STAGE"
            tar -czf "${STAGE}.tar.gz" "$STAGE"
            echo "ASSET=${STAGE}.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Smoke-test packaged Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $smokeDir = Join-Path $env:RUNNER_TEMP "jshell-release-smoke"
          $profileDir = Join-Path $smokeDir "profile"
          New-Item -ItemType Directory -Force -Path $smokeDir, $profileDir | Out-Null
          Expand-Archive -LiteralPath $env:ASSET -DestinationPath $smokeDir -Force

          $exe = Get-ChildItem -Path $smokeDir -Recurse -File -Filter "jshell.exe" | Select-Object -First 1
          if ($null -eq $exe) {
            throw "Packaged jshell.exe was not found"
          }

          $stageDir = $exe.Directory.FullName
          $requiredFiles = @(
            (Join-Path $stageDir "LICENSE")
            (Join-Path $stageDir "THIRD_PARTY_LICENSES/OFL-1.1.txt")
            (Join-Path $stageDir "THIRD_PARTY_LICENSES/Noto-CJK-SOURCE.zh-CN.md")
          )
          foreach ($requiredFile in $requiredFiles) {
            if (-not (Test-Path -LiteralPath $requiredFile -PathType Leaf)) {
              throw "Required release license file is missing: $requiredFile"
            }
          }

          $oldHome = $env:HOME
          $oldUserProfile = $env:USERPROFILE
          $env:HOME = $profileDir
          $env:USERPROFILE = $profileDir
          $process = $null
          try {
            $process = Start-Process -FilePath $exe.FullName -PassThru
            Start-Sleep -Seconds 5
            $process.Refresh()
            if ($process.HasExited) {
              throw "Packaged Windows app exited during startup smoke test with code $($process.ExitCode)"
            }
          } finally {
            if ($null -ne $process) {
              $process.Refresh()
              if (-not $process.HasExited) {
                Stop-Process -Id $process.Id -Force
              }
            }
            $env:HOME = $oldHome
            $env:USERPROFILE = $oldUserProfile
          }

      - name: Smoke-test packaged Linux app
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          SMOKE_DIR="$(mktemp -d)"
          trap 'rm -rf "$SMOKE_DIR"' EXIT
          tar -xzf "$ASSET" -C "$SMOKE_DIR"

          BIN="$(find "$SMOKE_DIR" -type f -name jshell -print -quit)"
          if [[ -z "$BIN" ]]; then
            echo "::error::Packaged Linux binary was not found."
            exit 1
          fi
          STAGE_DIR="$(dirname "$BIN")"
          test -s "$STAGE_DIR/LICENSE"
          test -s "$STAGE_DIR/THIRD_PARTY_LICENSES/OFL-1.1.txt"
          test -s "$STAGE_DIR/THIRD_PARTY_LICENSES/Noto-CJK-SOURCE.zh-CN.md"

          bash scripts/smoke-linux-keyring.sh \
            --require-display --binary "$BIN"

          bash scripts/smoke-linux-fallback.sh \
            --require-display --binary "$BIN"

      - name: Verify packaged macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          SMOKE_DIR="$(mktemp -d)"
          ditto -x -k "$ASSET" "$SMOKE_DIR"
          APP="$SMOKE_DIR/JShell.app"

          test -x "$APP/Contents/MacOS/JShell"
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) EXPECTED_ARCH="arm64" ;;
            x86_64-apple-darwin) EXPECTED_ARCH="x86_64" ;;
            *)
              echo "::error::Unexpected macOS target '${{ matrix.target }}'."
              exit 1
              ;;
          esac
          ACTUAL_ARCHS="$(lipo -archs "$APP/Contents/MacOS/JShell")"
          if [[ "$ACTUAL_ARCHS" != "$EXPECTED_ARCH" ]]; then
            echo "::error::Packaged macOS binary architecture '$ACTUAL_ARCHS' does not match '$EXPECTED_ARCH'."
            exit 1
          fi
          test -s "$APP/Contents/Resources/licenses/LICENSE"
          test -s "$APP/Contents/Resources/licenses/THIRD_PARTY_LICENSES/OFL-1.1.txt"
          test -s "$APP/Contents/Resources/licenses/THIRD_PARTY_LICENSES/Noto-CJK-SOURCE.zh-CN.md"
          plutil -lint "$APP/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "$PACKAGE_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")" = "$GITHUB_RUN_NUMBER"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Smoke-test packaged native macOS app
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          SMOKE_DIR="$(mktemp -d)"
          APP_PID=""
          cleanup() {
            if [[ -n "$APP_PID" ]] && kill -0 "$APP_PID" 2>/dev/null; then
              kill -KILL "$APP_PID" 2>/dev/null || true
            fi
            rm -rf "$SMOKE_DIR"
          }
          trap cleanup EXIT

          ditto -x -k "$ASSET" "$SMOKE_DIR"
          mkdir -p "$SMOKE_DIR/home"
          HOME="$SMOKE_DIR/home" "$SMOKE_DIR/JShell.app/Contents/MacOS/JShell" \
            >"$SMOKE_DIR/jshell.log" 2>&1 &
          APP_PID=$!
          sleep 5
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            wait "$APP_PID" || APP_EXIT=$?
            cat "$SMOKE_DIR/jshell.log"
            echo "::error::Packaged macOS app exited during startup smoke test with code ${APP_EXIT:-0}."
            exit 1
          fi

          kill -TERM "$APP_PID"
          for _ in {1..25}; do
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              break
            fi
            sleep 0.2
          done
          if kill -0 "$APP_PID" 2>/dev/null; then
            cat "$SMOKE_DIR/jshell.log"
            echo "::error::Packaged macOS app did not exit within 5 seconds of SIGTERM."
            kill -KILL "$APP_PID" 2>/dev/null || true
            wait "$APP_PID" 2>/dev/null || true
            APP_PID=""
            exit 1
          fi
          if wait "$APP_PID"; then
            APP_EXIT=0
          else
            APP_EXIT=$?
          fi
          APP_PID=""
          if [[ "$APP_EXIT" -ne 0 ]]; then
            cat "$SMOKE_DIR/jshell.log"
            echo "::error::Packaged macOS app exited after SIGTERM with code $APP_EXIT."
            exit 1
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}

  publish:
    name: Publish Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create or update the GitHub Release
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Verify Chinese release notes
        shell: bash
        run: |
          set -euo pipefail
          NOTES=".github/release-notes/${GITHUB_REF_NAME}.zh-CN.md"
          if [ ! -s "$NOTES" ]; then
            echo "::error::Missing or empty Chinese release notes: $NOTES"
            exit 1
          fi

      - name: Download all workflow artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Generate release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 4

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: JShell ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: .github/release-notes/${{ github.ref_name }}.zh-CN.md
          files: dist/*
          fail_on_unmatched_files: true
